info:
  name: "TC-ORD-005a: Order quantity boundary value analysis (zero quantity rejected)"
  type: http
  seq: 11
  tags:
    - orders
    - bva
    - negative

http:
  method: POST
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_token}}"
  body:
    type: json
    data: |-
      {
        "product_id": "{{seeded_macbook_id}}",
        "quantity": 0
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: INVALID_INPUT
  scripts:
    - type: tests
      code: |-
        test("TC-ORD-005a: HTTP status is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("TC-ORD-005a: Request must fail schema validation with INVALID_INPUT", function() {
          const body = res.getBody();
          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("INVALID_INPUT");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
