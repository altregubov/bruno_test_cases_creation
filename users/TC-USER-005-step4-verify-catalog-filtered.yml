info:
  name: "TC-USER-005 (Step 4): Verify catalog browse enforces newly applied filters"
  type: http
  seq: 8.2
  tags:
    - users
    - filters
    - catalog
    - p0

http:
  method: GET
  url: "{{base_url}}/api/user/products"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{filter_user_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("filter_user_token")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "filter_test_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { username: uname, password: "password123", role: "user", balance: 5000.00, allowed_categories: [], allowed_manufacturers: [] }
          });
          const uid = createRes.data.data.id;
          bru.setVar("filter_user_id", uid);
          await bru.sendRequest({
            method: "PUT",
            url: `${baseUrl}/api/admin/users/${uid}/filters`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { allowed_categories: ["laptop", "smartphone"], allowed_manufacturers: ["Apple", "Samsung"] }
          });
          const loginRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/login`,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            data: { username: uname, password: "password123" }
          });
          bru.setVar("filter_user_token", loginRes.data.data.token);
        }
    - type: tests
      code: |-
        test("TC-USER-005 (Step 4): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-USER-005 (Step 4): Catalog returns only whitelisted categories (laptop, smartphone) and brands (Apple, Samsung)", function() {
          const items = res.getBody().data;
          expect(items).to.be.an("array").that.is.not.empty;
          items.forEach(function(item) {
            expect(["laptop", "smartphone"]).to.include(item.category.toLowerCase());
            expect(["apple", "samsung"]).to.include(item.manufacturer.toLowerCase());
          });
        });

        test("TC-USER-005 (Step 4): Non-whitelisted brands (Dell, Xiaomi) are excluded from catalog", function() {
          const items = res.getBody().data;
          const hasDisallowedBrand = items.some(function(item) {
            return ["dell", "xiaomi"].includes(item.manufacturer.toLowerCase());
          });
          expect(hasDisallowedBrand).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
