info:
  name: "TC-USER-016b: Numeric boundary validation on balance top-up (sub-cent fractional 0.015 rejected)"
  type: http
  seq: 30
  tags:
    - users
    - finance
    - bva
    - audit-f03

http:
  method: POST
  url: "{{base_url}}/api/admin/users/{{user_a_id}}/balance/top-up"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "increment_amount": 0.015
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "false"
  scripts:
    - type: tests
      code: |-
        test("TC-USER-016b: HTTP status is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("TC-USER-016b: Sub-cent fractional value 0.015 must be rejected", function() {
          expect(res.getBody().success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
