info:
  name: "TC-USER-011 (Step 5): Replay active JWT of soft-deleted user on catalog endpoint (GET /api/user/products)"
  type: http
  seq: 21
  tags:
    - users
    - catalog
    - security
    - lifecycle
    - audit-f04
    - p0

http:
  method: GET
  url: "{{base_url}}/api/user/products"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{ephemeral_jwt}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: NOT_FOUND
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("ephemeral_jwt")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "jwt_lifecycle_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "Authorization": `Bearer ${bru.getVar("admin_token")}`
            },
            data: {
              username: uname,
              password: "password123",
              role: "user",
              balance: 5000.00,
              allowed_categories: [],
              allowed_manufacturers: []
            }
          });
          const uid = createRes.data.data.id;
          const loginRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/login`,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            data: { username: uname, password: "password123" }
          });
          bru.setVar("ephemeral_jwt", loginRes.data.data.token);
          await bru.sendRequest({
            method: "DELETE",
            url: `${baseUrl}/api/admin/users/${uid}`,
            headers: { "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` }
          });
        }
    - type: tests
      code: |-
        test("TC-USER-011 (Step 5): HTTP status is 404 Not Found when soft-deleted user requests catalog", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("TC-USER-011 (Step 5): Deactivated user token must be denied catalog access with NOT_FOUND", function() {
          const body = res.getBody();
          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
