info:
  name: "TC-ORD-014 (Step 1): Create user with joint category and brand restrictions"
  type: http
  seq: 33
  tags:
    - orders
    - whitelist
    - intersection
    - audit-f06
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "username": "{{tc_ord_014_username}}",
        "password": "password123",
        "role": "user",
        "balance": 5000.00,
        "allowed_categories": ["laptop"],
        "allowed_manufacturers": ["Apple"]
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: joint_user_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.username
        method: jsonq
      variable:
        name: joint_username
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("tc_ord_014_username", "joint_order_" + bru.interpolate("{{$guid}}"));
    - type: tests
      code: |-
        test("TC-ORD-014 (Step 1): Joint-restricted user created with HTTP 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
