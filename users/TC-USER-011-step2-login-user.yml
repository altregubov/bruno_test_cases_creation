info:
  name: "TC-USER-011 (Step 2): Login as user to acquire active JWT token"
  type: http
  seq: 18
  tags:
    - users
    - security
    - lifecycle
    - audit-f04
    - p0

http:
  method: POST
  url: "{{base_url}}/api/user/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{deactivated_user_name}}",
        "password": "password123"
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: ephemeral_jwt
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("deactivated_user_name")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "jwt_lifecycle_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "Authorization": `Bearer ${bru.getVar("admin_token")}`
            },
            data: {
              username: uname,
              password: "password123",
              role: "user",
              balance: 100.00,
              allowed_categories: [],
              allowed_manufacturers: []
            }
          });
          if (createRes && createRes.data && createRes.data.data) {
            bru.setVar("deactivated_user_id", createRes.data.data.id);
            bru.setVar("deactivated_user_name", createRes.data.data.username);
          }
        }
    - type: tests
      code: |-
        test("TC-USER-011 (Step 2): User logged in with HTTP 200 and acquired JWT", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.token).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
