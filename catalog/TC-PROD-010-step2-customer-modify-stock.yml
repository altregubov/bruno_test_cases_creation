info:
  name: "TC-PROD-010 (Step 2): RBAC enforcement blocks customer from modifying warehouse stock"
  type: http
  seq: 17
  tags:
    - catalog
    - rbac
    - security
    - p0

http:
  method: PATCH
  url: "{{base_url}}/api/admin/products/{{seeded_macbook_id}}/stock"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_token}}"
  body:
    type: json
    data: |-
      {
        "stock_quantity": 999
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: FORBIDDEN
  scripts:
    - type: tests
      code: |-
        test("TC-PROD-010 (Step 2): HTTP status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("TC-PROD-010 (Step 2): Customer cannot modify warehouse inventory", function() {
          const body = res.getBody();
          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("FORBIDDEN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
