info:
  name: "TC-ORD-004: Atomic rejection and FAILED record when product violates customer filter whitelist"
  type: http
  seq: 10
  tags:
    - orders
    - whitelist
    - security
    - negative
    - p0

http:
  method: POST
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_b_token}}"
  body:
    type: json
    data: |-
      {
        "product_id": "{{seeded_iphone_id}}",
        "quantity": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: FILTER_RESTRICTION
  scripts:
    - type: tests
      code: |-
        test("TC-ORD-004: HTTP status is 422 Unprocessable Entity", function() {
          expect(res.getStatus()).to.equal(422);
        });

        test("TC-ORD-004: Response success must be false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("TC-ORD-004: Error code must be FILTER_RESTRICTION", function() {
          expect(res.getBody().error.code).to.equal("FILTER_RESTRICTION");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
