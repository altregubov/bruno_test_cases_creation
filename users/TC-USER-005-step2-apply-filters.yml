info:
  name: "TC-USER-005 (Step 2): Apply whitelist filters to newly created user"
  type: http
  seq: 8
  tags:
    - users
    - filters
    - admin
    - p0

http:
  method: PUT
  url: "{{base_url}}/api/admin/users/{{filter_user_id}}/filters"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "allowed_categories": ["laptop", "smartphone"],
        "allowed_manufacturers": ["Apple", "Samsung"]
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.allowed_categories
      operator: length
      value: "2"
    - expression: res.body.data.allowed_manufacturers
      operator: length
      value: "2"
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("filter_user_id")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "filter_test_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "Authorization": `Bearer ${bru.getVar("admin_token")}`
            },
            data: {
              username: uname,
              password: "password123",
              role: "user",
              balance: 5000.00,
              allowed_categories: [],
              allowed_manufacturers: []
            }
          });
          if (createRes && createRes.data && createRes.data.data && createRes.data.data.id) {
            bru.setVar("filter_user_id", createRes.data.data.id);
            bru.setVar("filter_user_name", uname);
            const loginRes = await bru.sendRequest({
              method: "POST",
              url: `${baseUrl}/api/user/login`,
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              data: { username: uname, password: "password123" }
            });
            if (loginRes && loginRes.data && loginRes.data.data) {
              bru.setVar("filter_user_token", loginRes.data.data.token);
            }
          }
        }
    - type: tests
      code: |-
        test("TC-USER-005 (Step 2): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-USER-005 (Step 2): Filter configuration must succeed", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("TC-USER-005 (Step 2): Allowed categories must contain 2 entries", function() {
          expect(res.getBody().data.allowed_categories).to.be.an("array").with.lengthOf(2);
        });

        test("TC-USER-005 (Step 2): Allowed manufacturers must contain 2 entries", function() {
          expect(res.getBody().data.allowed_manufacturers).to.be.an("array").with.lengthOf(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
