info:
  name: "TC-PROD-006 (Step 2): Query disallowed category 'smartphone' as category-restricted user"
  type: http
  seq: 8
  tags:
    - catalog
    - whitelist
    - security
    - p0

http:
  method: GET
  url: "{{base_url}}/api/user/products?category=smartphone"
  params:
    - name: category
      value: smartphone
      type: query
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_b_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: length
      value: "0"
  scripts:
    - type: tests
      code: |-
        test("TC-PROD-006 (Step 2): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-PROD-006 (Step 2): Request must succeed", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("TC-PROD-006 (Step 2): Disallowed category must return empty array", function() {
          expect(res.getBody().data).to.be.an("array").with.lengthOf(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
