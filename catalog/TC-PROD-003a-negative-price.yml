info:
  name: "TC-PROD-003a: Validate boundary constraints on product creation (negative price rejected)"
  type: http
  seq: 3
  tags:
    - catalog
    - inventory
    - bva
    - negative

http:
  method: POST
  url: "{{base_url}}/api/admin/products"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "category": "tablet",
        "manufacturer": "Apple",
        "model": "iPad Air",
        "price": -10.00,
        "stock_quantity": 10
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: INVALID_INPUT
  scripts:
    - type: tests
      code: |-
        test("TC-PROD-003a: HTTP status is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("TC-PROD-003a: Request must be rejected with 400 Bad Request and INVALID_INPUT", function() {
          const body = res.getBody();
          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("INVALID_INPUT");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
