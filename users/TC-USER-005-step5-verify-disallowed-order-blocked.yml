info:
  name: "TC-USER-005 (Step 5): Verify order creation is blocked for brand excluded by updated filter (422 FILTER_RESTRICTION)"
  type: http
  seq: 8.3
  tags:
    - users
    - filters
    - orders
    - p0

http:
  method: POST
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{filter_user_token}}"
  body:
    type: json
    data: |-
      {
        "product_id": "{{seeded_dell_laptop_id}}",
        "quantity": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: FILTER_RESTRICTION
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("filter_user_token")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "filter_test_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { username: uname, password: "password123", role: "user", balance: 5000.00, allowed_categories: [], allowed_manufacturers: [] }
          });
          const uid = createRes.data.data.id;
          bru.setVar("filter_user_id", uid);
          await bru.sendRequest({
            method: "PUT",
            url: `${baseUrl}/api/admin/users/${uid}/filters`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { allowed_categories: ["laptop", "smartphone"], allowed_manufacturers: ["Apple", "Samsung"] }
          });
          const loginRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/login`,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            data: { username: uname, password: "password123" }
          });
          bru.setVar("filter_user_token", loginRes.data.data.token);
        }
    - type: tests
      code: |-
        test("TC-USER-005 (Step 5): HTTP status is 422 Unprocessable Entity", function() {
          expect(res.getStatus()).to.equal(422);
        });

        test("TC-USER-005 (Step 5): Ordering Dell laptop is blocked with FILTER_RESTRICTION while Dell is not whitelisted", function() {
          const body = res.getBody();
          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("FILTER_RESTRICTION");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
