info:
  name: "TC-USER-011 (Step 1): Create user for deactivation lifecycle test"
  type: http
  seq: 17
  tags:
    - users
    - security
    - lifecycle
    - audit-f04
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "username": "{{tc_user_011_username}}",
        "password": "password123",
        "role": "user",
        "balance": 5000.00,
        "allowed_categories": [],
        "allowed_manufacturers": []
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: deactivated_user_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.username
        method: jsonq
      variable:
        name: deactivated_user_name
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("tc_user_011_username", "jwt_lifecycle_" + bru.interpolate("{{$guid}}"));
    - type: tests
      code: |-
        test("TC-USER-011 (Step 1): User created with HTTP 201", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().data.id).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
