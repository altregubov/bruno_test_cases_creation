info:
  name: "TC-ORD-002 (Step 1): Create user with minimal balance ($10.00)"
  type: http
  seq: 4
  tags:
    - orders
    - finance
    - negative
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "username": "{{broke_username}}",
        "password": "password123",
        "role": "user",
        "balance": 10.00,
        "allowed_categories": [],
        "allowed_manufacturers": []
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: broke_user_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.username
        method: jsonq
      variable:
        name: broke_username
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("broke_username", "broke_user_" + bru.interpolate("{{$guid}}"));
    - type: tests
      code: |-
        test("TC-ORD-002 (Step 1): Low-balance user created with HTTP 201", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().data.id).to.be.a("string").and.not.be.empty;
          expect(res.getBody().data.balance).to.equal(10.00);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
