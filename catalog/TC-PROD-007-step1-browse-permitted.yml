info:
  name: "TC-PROD-007 (Step 1): Query catalog as manufacturer-restricted user"
  type: http
  seq: 9
  tags:
    - catalog
    - whitelist
    - security
    - p0

http:
  method: GET
  url: "{{base_url}}/api/user/products"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_c_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("TC-PROD-007 (Step 1): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-PROD-007 (Step 1): Catalog browse must succeed", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("TC-PROD-007 (Step 1): All returned products must strictly have manufacturer 'Apple'", function() {
          const items = res.getBody().data;
          expect(items).to.be.an("array").that.is.not.empty;
          items.forEach(function(item) {
            expect(item.manufacturer).to.equal("Apple");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
