info:
  name: "TC-ORD-002 (Step 3): Attempt purchasing expensive MacBook Pro ($2499.00)"
  type: http
  seq: 6
  tags:
    - orders
    - finance
    - negative
    - p0

http:
  method: POST
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{broke_user_token}}"
  body:
    type: json
    data: |-
      {
        "product_id": "{{seeded_macbook_id}}",
        "quantity": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: INSUFFICIENT_FUNDS
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("broke_user_token")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const uname = "broke_user_" + bru.interpolate("{{$guid}}");
          const createRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "Authorization": `Bearer ${bru.getVar("admin_token")}`
            },
            data: {
              username: uname,
              password: "password123",
              role: "user",
              balance: 10.00,
              allowed_categories: [],
              allowed_manufacturers: []
            }
          });
          if (createRes && createRes.data && createRes.data.data) {
            bru.setVar("broke_user_id", createRes.data.data.id);
            bru.setVar("broke_username", createRes.data.data.username);
            const loginRes = await bru.sendRequest({
              method: "POST",
              url: `${baseUrl}/api/user/login`,
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              data: { username: uname, password: "password123" }
            });
            if (loginRes && loginRes.data && loginRes.data.data) {
              bru.setVar("broke_user_token", loginRes.data.data.token);
            }
          }
        }
    - type: tests
      code: |-
        test("TC-ORD-002 (Step 3): HTTP status is 422 Unprocessable Entity", function() {
          expect(res.getStatus()).to.equal(422);
        });

        test("TC-ORD-002 (Step 3): Response success must be false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("TC-ORD-002 (Step 3): Error code must be INSUFFICIENT_FUNDS", function() {
          expect(res.getBody().error.code).to.equal("INSUFFICIENT_FUNDS");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
