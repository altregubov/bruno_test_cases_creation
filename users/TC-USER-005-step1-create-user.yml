info:
  name: "TC-USER-005 (Step 1): Create test user for filter assignment"
  type: http
  seq: 7
  tags:
    - users
    - filters
    - admin
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "username": "{{tc_user_005_username}}",
        "password": "password123",
        "role": "user",
        "balance": 1000.00,
        "allowed_categories": [],
        "allowed_manufacturers": []
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: filter_user_id
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("tc_user_005_username", "filter_test_" + bru.interpolate("{{$guid}}"));
    - type: tests
      code: |-
        test("TC-USER-005 (Step 1): HTTP status is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().data.id).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
