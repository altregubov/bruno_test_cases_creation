info:
  name: "TC-ORD-009 (Step 3): Verify warehouse product stock is restored after cancellation"
  type: http
  seq: 19
  tags:
    - smoke
    - orders
    - cancellation
    - admin
    - p0

http:
  method: GET
  url: "{{base_url}}/api/admin/products"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: before-request
      code: |-
        // Standalone guard if Step 3 is executed without Step 1
        if (bru.getVar("tc_ord_009_pre_order_stock") == null) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const dellId = bru.getEnvVar("seeded_dell_laptop_id") || bru.getCollectionVar("seeded_dell_laptop_id") || "c0000000-0000-0000-0000-000000000002";

          const prodBefore = await bru.sendRequest({
            method: "GET",
            url: `${baseUrl}/api/admin/products`,
            headers: { "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` }
          });
          const dell = prodBefore.data.data.find((p) => p.id === dellId);
          bru.setVar("tc_ord_009_pre_order_stock", dell.stock_quantity);

          const ordRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/orders`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("user_token")}` },
            data: { product_id: dellId, quantity: 2 }
          });
          const ordData = ordRes.data.data;
          bru.setVar("tc_ord_009_order_qty", ordData.quantity);
          bru.setVar("tc_ord_009_post_order_stock", dell.stock_quantity - ordData.quantity);

          await bru.sendRequest({
            method: "PATCH",
            url: `${baseUrl}/api/admin/orders/${ordData.order_id}/status`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { status: "CANCELLED" }
          });
          bru.setVar("cancelled_order_id", ordData.order_id);
        }
    - type: tests
      code: |-
        test("TC-ORD-009 (Step 3): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-ORD-009 (Step 3): Warehouse stock is restored by exact cancelled order quantity", function() {
          const dellId = bru.getEnvVar("seeded_dell_laptop_id") || bru.getCollectionVar("seeded_dell_laptop_id") || "c0000000-0000-0000-0000-000000000002";
          const preOrderStock = Number(bru.getVar("tc_ord_009_pre_order_stock"));
          const postOrderStock = Number(bru.getVar("tc_ord_009_post_order_stock"));
          const orderQty = Number(bru.getVar("tc_ord_009_order_qty"));

          const products = res.getBody().data;
          const dellProduct = products.find(function(p) { return p.id === dellId; });
          expect(dellProduct).to.not.be.undefined;
          expect(dellProduct.stock_quantity).to.equal(postOrderStock + orderQty);
          expect(dellProduct.stock_quantity).to.equal(preOrderStock);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
