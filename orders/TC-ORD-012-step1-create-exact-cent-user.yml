info:
  name: "TC-ORD-012 (Step 1): Create user with balance exactly $59.97 (3 * 19.99)"
  type: http
  seq: 24
  tags:
    - orders
    - finance
    - precision
    - audit-f03
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "username": "{{tc_ord_012_username}}",
        "password": "password123",
        "role": "user",
        "balance": 59.97,
        "allowed_categories": [],
        "allowed_manufacturers": []
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: cent_user_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.username
        method: jsonq
      variable:
        name: cent_username
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("tc_ord_012_username", "exact_cent_" + bru.interpolate("{{$guid}}"));
    - type: tests
      code: |-
        test("TC-ORD-012 (Step 1): User created with balance 59.97", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().data.balance).to.equal(59.97);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
