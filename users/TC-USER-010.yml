info:
  name: "TC-USER-010: RBAC enforcement blocks customer role from administrative user management endpoints"
  type: http
  seq: 16
  tags:
    - users
    - rbac
    - security
    - p0

http:
  method: POST
  url: "{{base_url}}/api/admin/users"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_token}}"
  body:
    type: json
    data: |-
      {
        "username": "illegal_user",
        "password": "password123",
        "role": "admin",
        "balance": 999999.00
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: FORBIDDEN
  scripts:
    - type: tests
      code: |-
        test("TC-USER-010: HTTP status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("TC-USER-010: Response success must be false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("TC-USER-010: Error code must be FORBIDDEN", function() {
          expect(res.getBody().error.code).to.equal("FORBIDDEN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
