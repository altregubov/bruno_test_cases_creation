info:
  name: "TC-USER-011 (Step 3): Admin executes soft-delete on the user account"
  type: http
  seq: 19
  tags:
    - users
    - security
    - lifecycle
    - audit-f04
    - p0

http:
  method: DELETE
  url: "{{base_url}}/api/admin/users/{{deactivated_user_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("TC-USER-011 (Step 3): User account soft-deleted with HTTP 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
