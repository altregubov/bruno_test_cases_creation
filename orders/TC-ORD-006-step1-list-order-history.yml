info:
  name: "TC-ORD-006 (Step 1): Retrieve customer order history list"
  type: http
  seq: 13
  tags:
    - smoke
    - orders
    - audit
    - p0

http:
  method: GET
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && Array.isArray(body.data) && body.data.length > 0) {
          const firstOrder = body.data[0];
          const firstOrderId = firstOrder.id || firstOrder.order_id;
          bru.setVar("first_order_id", firstOrderId);
          if (!bru.getVar("user_a_order_id")) {
            bru.setVar("user_a_order_id", firstOrderId);
          }
        }
    - type: tests
      code: |-
        test("TC-ORD-006 (Step 1): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-ORD-006 (Step 1): Order listing must succeed", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("TC-ORD-006 (Step 1): At least one order in history", function() {
          expect(res.getBody().data).to.be.an("array");
          expect(res.getBody().data.length).to.be.at.least(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
