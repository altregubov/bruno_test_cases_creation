info:
  name: "TC-ORD-003: Atomic rejection and FAILED ledger record when warehouse stock is insufficient"
  type: http
  seq: 9
  tags:
    - orders
    - inventory
    - negative
    - p0

http:
  method: POST
  url: "{{base_url}}/api/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{user_token}}"
  body:
    type: json
    data: |-
      {
        "product_id": "{{seeded_macbook_id}}",
        "quantity": 9999
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.success
      operator: eq
      value: "false"
    - expression: res.body.error.code
      operator: eq
      value: INSUFFICIENT_STOCK
  scripts:
    - type: tests
      code: |-
        test("TC-ORD-003: HTTP status is 422 Unprocessable Entity", function() {
          expect(res.getStatus()).to.equal(422);
        });

        test("TC-ORD-003: Response success must be false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("TC-ORD-003: Error code must be INSUFFICIENT_STOCK", function() {
          expect(res.getBody().error.code).to.equal("INSUFFICIENT_STOCK");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
