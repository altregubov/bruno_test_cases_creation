info:
  name: "TC-ORD-013 (Step 5): Admin cancels order of the now-deactivated customer"
  type: http
  seq: 32
  tags:
    - orders
    - lifecycle
    - cancellation
    - audit-f04

http:
  method: PATCH
  url: "{{base_url}}/api/admin/orders/{{deact_order_id}}/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{admin_token}}"
  body:
    type: json
    data: |-
      {
        "status": "CANCELLED"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.status
      operator: eq
      value: CANCELLED
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("deact_order_id")) {
          const baseUrl = bru.getEnvVar("base_url") || bru.getCollectionVar("base_url") || "http://localhost:8080";
          const macbookId = bru.getEnvVar("seeded_macbook_id") || bru.getCollectionVar("seeded_macbook_id") || "c0000000-0000-0000-0000-000000000001";
          const uname = "order_deact_" + bru.interpolate("{{$guid}}");
          const uRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/admin/users`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` },
            data: { username: uname, password: "password123", role: "user", balance: 5000.00, allowed_categories: [], allowed_manufacturers: [] }
          });
          const uid = uRes.data.data.id;
          const lRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/login`,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            data: { username: uname, password: "password123" }
          });
          const oRes = await bru.sendRequest({
            method: "POST",
            url: `${baseUrl}/api/user/orders`,
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": `Bearer ${lRes.data.data.token}` },
            data: { product_id: macbookId, quantity: 1 }
          });
          bru.setVar("deact_order_id", oRes.data.data.order_id);
          await bru.sendRequest({
            method: "DELETE",
            url: `${baseUrl}/api/admin/users/${uid}`,
            headers: { "Accept": "application/json", "Authorization": `Bearer ${bru.getVar("admin_token")}` }
          });
        }
    - type: tests
      code: |-
        test("TC-ORD-013 (Step 5): HTTP status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("TC-ORD-013 (Step 5): Order cancellation must succeed and update status to CANCELLED despite user deactivation", function() {
          const body = res.getBody();
          expect(body.success).to.equal(true);
          expect(body.data.status).to.equal("CANCELLED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
